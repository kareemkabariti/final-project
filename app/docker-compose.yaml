services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - vault_network

  vault-agent:
    image: hashicorp/vault:1.17
    volumes:
      - ./vault-agent:/vault/config
      - vault-secrets:/vault/secrets
      - ./vault-token:/vault/token
    command: >
      sh -c "vault agent -config=/vault/config/agent.hcl"
    environment:
      VAULT_ADDR: http://vault-vault-1:8200
    networks:
      - vault_network

  backend:
    build: ../backend
    ports:
      - "5000:5000"
    volumes:
      - vault-secrets:/vault/secrets
    depends_on:
      - database
      - vault-agent
    networks:
      - vault_network

  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    networks:
      - vault_network

volumes:
  db_data:
  vault-secrets:
  vault-token:

networks:
  vault_network:
    name: vault_default
    external: true

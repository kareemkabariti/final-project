name: Security Scan

on:
  push:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Bandit Python Security Scan
        run: |
          pip install bandit
          bandit -r backend || true


      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./


      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile


      - name: Build Backend Image
        run: |
          docker build -t secure-backend ./backend


      - name: Build Frontend Image
        run: |
          docker build -t secure-frontend ./frontend


      - name: Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-backend
          severity: HIGH,CRITICAL
          exit-code: 0


      - name: Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-frontend
          severity: HIGH,CRITICAL
          exit-code: 0


      - name: Trivy PostgreSQL 9.6 Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: postgres:9.6
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

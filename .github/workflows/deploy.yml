- name: Deploy Backend
  run: |
    docker stop backend || true
    docker rm backend || true
    docker build -t secure-backend ./backend
    docker run -d --name backend -p 5000:5000 secure-backend

- name: Deploy Frontend
  run: |
    docker stop frontend || true
    docker rm frontend || true
    docker build -t secure-frontend ./frontend
    docker run -d --name frontend -p 8080:80 secure-frontend
